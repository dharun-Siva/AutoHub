version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: autohub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: autohub
      POSTGRES_USER: autohub_user
      POSTGRES_PASSWORD: autohub_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
